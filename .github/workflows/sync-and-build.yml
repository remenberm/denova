name: Sync Upstream and Build Docker Image

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）检查上游更新
    - cron: '0 2 * * *'
  workflow_dispatch:   # 支持手动触发

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: alfredxw/denova

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 用于把上游更新推回你的 fork
      packages: write    # 用于推送镜像到 GHCR

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream

          BEFORE=$(git rev-parse HEAD)
          git merge --ff-only upstream/master || git merge upstream/master -m "Sync upstream $(date -u +%Y-%m-%d)"
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "上游无更新，跳过构建"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git push origin master
          fi

      - name: Generate date tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
