name: Sync Upstream Tags

on:
  schedule:
    # 每 6 小时检查一次上游新 tag
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来获取 tags

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/alfredxw/denova.git

      - name: Fetch upstream tags
        run: |
          git fetch upstream --tags --force

      - name: Push new tags to fork
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git push origin --tags
